<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Precios por país en el mercado de eSIM de viaje</title>
<style>
:root{
  --green:#16a06a;
  --green-d:#0f7a50;
  --ink:#16242f;
  --muted:#6b7c8a;
  --line:#e7edf1;
  --bg:#f7f9fb;
  --card:#fff;
  --red:#e15241;
  --red-d:#b3382b;
  --red-bg:#fce9e7;
  --amber:#e8a317;
  --amber-d:#8a5a00;
  --amber-bg:#fdf3dd;
  --blue:#3949ab;
  --blue-bg:#e8eaf6;
  --title:#1c3d5a;
  --green-bg:#e6f5ee;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,Arial,sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 64px}
a{color:var(--green-d)}

/* ---------- header ---------- */
header.top{
  display:flex;align-items:flex-start;justify-content:space-between;
  gap:16px;flex-wrap:wrap;margin-bottom:22px;
}
.brandline{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1.doc{font-size:20px;line-height:1.3;margin:6px 0 2px;color:var(--title);font-weight:650}
.docsub{font-size:13px;color:var(--muted)}
.langtoggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.langtoggle button{
  font:inherit;font-size:12.5px;font-weight:600;letter-spacing:.03em;
  padding:7px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer;
}
.langtoggle button[aria-pressed="true"]{background:var(--green);color:#fff}
.langtoggle button:focus-visible{outline:2px solid var(--green-d);outline-offset:-2px}

/* ---------- cards ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:22px 24px;margin-bottom:18px;
}
.card.tight{padding:18px 20px}
h2.sec{font-size:15px;margin:0 0 4px;color:var(--title);font-weight:650;letter-spacing:.01em}
.seclead{font-size:13px;color:var(--muted);margin:0 0 16px}

/* ---------- N0 headline ---------- */
.n0 .verdict{font-size:26px;line-height:1.28;font-weight:650;margin:0 0 10px;letter-spacing:-.01em}
.n0 .verdict em{font-style:normal;color:var(--green-d)}
.n0 .vsub{font-size:14.5px;color:var(--muted);margin:0 0 20px;max-width:64ch}
.partition{display:flex;gap:10px;flex-wrap:wrap}
.pcell{
  flex:1 1 180px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--bg);
}
.pcell .pnum{font-size:26px;font-weight:680;line-height:1;font-variant-numeric:tabular-nums}
.pcell .plabel{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-top:6px}
.pcell .pdesc{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.45}
.pcell.is-measured .pnum,.pcell.is-measured .plabel{color:var(--green-d)}
.pcell.is-inferred .pnum,.pcell.is-inferred .plabel{color:var(--blue)}
.pcell.is-undet .pnum,.pcell.is-undet .plabel{color:var(--amber-d)}
.prov{font-size:12px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}

/* ---------- chips ---------- */
.chip{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;white-space:nowrap;
}
.chip-measured{background:var(--green-bg);color:var(--green-d)}
.chip-inferred{background:var(--blue-bg);color:var(--blue)}
.chip-undet{background:var(--amber-bg);color:var(--amber-d)}
.chip-alert{background:var(--red-bg);color:var(--red-d)}

/* ---------- two questions ---------- */
.qgrid{display:flex;gap:14px;flex-wrap:wrap}
.qbox{flex:1 1 320px;border:1px solid var(--line);border-radius:10px;padding:16px 18px;background:var(--bg)}
.qbox .q{font-size:14px;font-weight:620;margin:0 0 8px;line-height:1.4}
.qbox .a{font-size:20px;font-weight:680;margin:0 0 6px;line-height:1.2}
.qbox.yes .a{color:var(--green-d)}
.qbox.no .a{color:var(--amber-d)}
.qbox .detail{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.5}
.closing{font-size:14px;margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);max-width:72ch}

/* ---------- table ----------
   No overflow on the wrapper: it would neutralise position:sticky on the header.
   Corners are rounded on the extreme cells instead. */
.tablewrap{border:1px solid var(--line);border-radius:10px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
thead th{
  position:sticky;top:0;background:var(--card);z-index:2;
  text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:11px 14px;border-bottom:1px solid var(--line);
}
thead th:first-child{border-top-left-radius:10px}
thead th:last-child{border-top-right-radius:10px}
tbody tr:last-child td:first-child{border-bottom-left-radius:10px}
tbody tr:last-child td:last-child{border-bottom-right-radius:10px}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr.rowmain.alt td{background:var(--bg)}
tbody tr.rowmain{cursor:pointer}
tbody tr.rowmain:hover td{background:#eef4f8}
tbody tr:last-child td{border-bottom:0}
td.name{font-weight:620;white-space:nowrap}
.tw{display:inline-block;width:11px;margin-right:5px;color:var(--muted);font-size:10px;letter-spacing:0}
td.num{text-align:right;white-space:nowrap;color:var(--muted)}
tr.rowdetail td{background:#fbfdfe;font-size:13px;color:var(--ink);padding:0 14px 14px 30px}
tr.rowdetail dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
tr.rowdetail dt{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:2px;white-space:nowrap}
tr.rowdetail dd{margin:0;line-height:1.5}
tr.grouprow{cursor:pointer}
tr.grouprow td{background:#fbfdfe;padding:14px;vertical-align:middle}
tr.grouprow:hover td{background:#eef4f8}
tr.grouprow:focus-visible{outline:2px solid var(--green-d);outline-offset:-2px}
td.gname{font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--title)}
td.gverdict{font-size:13px;color:var(--muted)}
tr.grouprow td.num{font-size:12px;color:var(--muted)}

/* case fold inside the trust box */
details.inlinecase{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.inlinecase>summary{
  list-style:none;cursor:pointer;font-size:13px;font-weight:620;color:var(--green-d);
  display:inline-flex;align-items:center;gap:6px;
}
details.inlinecase>summary::-webkit-details-marker{display:none}
details.inlinecase>summary::before{content:"▸";font-size:10px}
details.inlinecase[open]>summary::before{content:"▾"}
details.inlinecase>summary:focus-visible{outline:2px solid var(--green-d);outline-offset:2px;border-radius:4px}
.casebody{margin-top:12px}

/* ---------- trust box ---------- */
.trust{border-left:3px solid var(--green)}
.trust .tlead{font-size:15px;font-weight:620;margin:0 0 12px;line-height:1.45}
.trust p{margin:0 0 11px;max-width:74ch;font-size:14px}
.trust p:last-child{margin-bottom:0}
.trust .kicker{font-weight:620;color:var(--green-d)}

/* ---------- accordion ---------- */
details.acc{border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px}
details.acc>summary{
  list-style:none;cursor:pointer;padding:16px 22px;font-size:14px;font-weight:620;color:var(--title);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";color:var(--muted);font-weight:600;font-size:16px}
details.acc[open]>summary::after{content:"–"}
details.acc>summary:focus-visible{outline:2px solid var(--green-d);outline-offset:-2px;border-radius:12px}
.accbody{padding:0 22px 20px;font-size:13.5px}
.accbody h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;font-weight:700}
.accbody h3:first-child{margin-top:0}
.accbody p{margin:0 0 10px;max-width:76ch}
.accbody ul{margin:0 0 10px;padding-left:18px}
.accbody li{margin-bottom:5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;margin:0 0 10px;font-variant-numeric:tabular-nums}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

footer.foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .n0 .verdict{font-size:21px}
  .wrap{padding:18px 14px 48px}
  .card{padding:18px 16px}
  td.num{display:none}
  thead th.num{display:none}
}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div>
    <div class="brandline" id="brandline"></div>

  </div>
  <div class="langtoggle" role="group" aria-label="Language">
    <button type="button" data-lang="es">ES</button>
    <button type="button" data-lang="en">EN</button>
  </div>
</header>

<section class="card n0" id="v-headline"></section>
<section class="card" id="v-message"></section>
<section class="card" id="v-table"></section>
<section class="card trust" id="v-trust"></section>
<div id="v-method"></div>
<footer class="foot" id="v-footer"></footer>

</div>

   STATE — plain JS variables. No browser storage anywhere.

/* =========================================================================
   HELPERS
   ========================================================================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
var EV_CHIP = { measured:"chip-measured", inferred:"chip-inferred", undetermined:"chip-undet" };
var EV_LABEL = { measured:"pMeasured", inferred:"pInferred", undetermined:"pUndet" };
var GROUP_LABEL = { curr:"gCurr", global:"gGlobal", telcoM:"gTelcoM", telcoI:"gTelcoI", undet:"gUndet" };
var GROUP_VERDICT = { curr:"vCurr", global:"vGlobal", telcoM:"vTelcoM", telcoI:"vTelcoI", undet:"vUndet" };

function detailFor(p, lang){
  if (DETAIL[p.id]) return DETAIL[p.id][lang];
  return TELCO_INFERRED_DETAIL[lang];
}

/* =========================================================================
   VIEWS — one function per region. render() walks this map.
   ========================================================================= */
var VIEWS = {

  "v-headline": function(t){
    var cells = [
      { cls:"is-measured", n:DATA.measured,     lab:t.pMeasured, desc:t.pMeasuredD },
      { cls:"is-inferred", n:DATA.inferred,     lab:t.pInferred, desc:t.pInferredD },
      { cls:"is-undet",    n:DATA.undetermined, lab:t.pUndet,    desc:t.pUndetD }
    ];
    var html = '<p class="verdict"><em>' + esc(t.verdictA) + '</em> ' + esc(t.verdictB) + '</p>';
    html += '<p class="vsub">' + esc(t.vsub) + '</p>';
    html += '<div class="partition">';
    cells.forEach(function(c){
      html += '<div class="pcell ' + c.cls + '">'
           +    '<div class="pnum">' + c.n + '</div>'
           +    '<div class="plabel">' + esc(c.lab) + '</div>'
           +    '<div class="pdesc">' + esc(c.desc) + '</div>'
           +  '</div>';
    });
    html += '</div>';
    html += '<p class="prov">' + esc(t.prov) + '</p>';
    return html;
  },

  "v-message": function(t){
    var qs = [
      { cls:"yes", q:t.q1, a:t.a1, d:t.d1, ev:"measured" },
      { cls:"no",  q:t.q2, a:t.a2, d:t.d2, ev:"inferred" }
    ];
    var html = '<h2 class="sec">' + esc(t.msgTitle) + '</h2>';
    html += '<p class="seclead">' + esc(t.msgLead) + '</p>';
    html += '<div class="qgrid">';
    qs.forEach(function(x){
      html += '<div class="qbox ' + x.cls + '">'
           +    '<p class="q">' + esc(x.q) + '</p>'
           +    '<p class="a">' + esc(x.a) + '</p>'
           +    '<p class="detail">' + esc(x.d) + '</p>'
           +    '<span class="chip ' + EV_CHIP[x.ev] + '">' + esc(t[EV_LABEL[x.ev]]) + '</span>'
           +  '</div>';
    });
    html += '</div>';
    html += '<p class="closing">' + esc(t.closing) + '</p>';
    return html;
  },

  "v-table": function(t){
    var html = '<h2 class="sec">' + esc(t.tblTitle) + '</h2>';
    html += '<p class="seclead">' + esc(t.tblLead) + '</p>';
    html += '<div class="tablewrap"><table><thead><tr>'
         +  '<th>' + esc(t.thName) + '</th>'
         +  '<th>' + esc(t.thVerdict) + '</th>'
         +  '<th>' + esc(t.thEvidence) + '</th>'
         +  '<th class="num">' + esc(t.thCells) + '</th>'
         +  '</tr></thead><tbody>';

    DATA.groups.forEach(function(g){
      var rows = DATA.players.filter(function(p){ return p.g === g; });
      if (!rows.length) return;

      // Executive mode: groups render collapsed. The group row carries the whole
      // verdict for its members, so the reader gets the answer without expanding.
      var gOpen = !!state.groupOpen[g];
      var gEv   = rows[0].ev;
      html += '<tr class="grouprow" data-gid="' + g + '" tabindex="0" role="button" aria-expanded="' + gOpen + '">'
           +    '<td class="gname"><span class="tw">' + (gOpen ? "▾" : "▸") + '</span>' + esc(t[GROUP_LABEL[g]]) + '</td>'
           +    '<td class="gverdict">' + esc(t[GROUP_VERDICT[g]]) + '</td>'
           +    '<td><span class="chip ' + EV_CHIP[gEv] + '">' + esc(t[EV_LABEL[gEv]]) + '</span></td>'
           +    '<td class="num">' + rows.length + ' ' + esc(t.nComp) + '</td>'
           +  '</tr>';
      if (!gOpen) return;

      // Striping restarts inside each group, over player rows only, so neither the
      // group headers nor an expanded detail row can shift the pattern.
      var stripe = 0;

      rows.forEach(function(p){
        var open = !!state.expanded[p.id];
        var alt  = (stripe++ % 2 === 1) ? " alt" : "";
        var cellsTxt = p.cells ? esc(p.cells) : (p.cellsK ? esc(t[p.cellsK]) : esc(t.naShort));
        html += '<tr class="rowmain' + alt + '" data-pid="' + p.id + '" tabindex="0" role="button" aria-expanded="' + open + '">'
             +   '<td class="name"><span class="tw">' + (open ? "▾" : "▸") + '</span>' + esc(p.name) + '</td>'
             +   '<td>' + esc(t[GROUP_VERDICT[p.g]]) + '</td>'
             +   '<td><span class="chip ' + EV_CHIP[p.ev] + '">' + esc(t[EV_LABEL[p.ev]]) + '</span></td>'
             +   '<td class="num">' + cellsTxt + '</td>'
             + '</tr>';
        if (open){
          var d = detailFor(p, state.lang);
          html += '<tr class="rowdetail"><td colspan="4"><dl>'
               +    '<dt>' + esc(t.dlWhat)   + '</dt><dd>' + esc(d.what)   + '</dd>'
               +    '<dt>' + esc(t.dlHow)    + '</dt><dd>' + esc(d.how)    + '</dd>'
               +    '<dt>' + esc(t.dlResult) + '</dt><dd>' + esc(d.result) + '</dd>'
               +    '<dt>' + esc(t.dlNote)   + '</dt><dd>' + esc(d.note)   + '</dd>'
               +  '</dl></td></tr>';
        }
      });
    });

    html += '</tbody></table></div>';
    return html;
  },

  "v-trust": function(t){
    // Executive mode: lead + closing stay visible; the full Brazil case folds away.
    var html = '<h2 class="sec">' + esc(t.trustTitle) + '</h2>';
    html += '<p class="tlead">' + esc(t.trustLead) + '</p>';
    html += '<p class="kicker">' + esc(t.trustP4) + '</p>';
    html += '<details class="inlinecase" data-acc="trustcase"' + (state.accOpen.trustcase ? " open" : "") + '>'
         +    '<summary>' + esc(t.trustMore) + '</summary>'
         +    '<div class="casebody">'
         +      '<p>' + esc(t.trustP1) + '</p>'
         +      '<p>' + esc(t.trustP2) + '</p>'
         +      '<p>' + esc(t.trustP3) + '</p>'
         +    '</div>'
         +  '</details>';
    return html;
  },

  "v-method": function(t){
    var blocks = [
      { key:"method", title:t.accMethod, body:
          '<h3>' + esc(t.mWhat)   + '</h3><p>' + esc(t.mWhatP)   + '</p>'
        + '<h3>' + esc(t.mWhy)    + '</h3><p>' + esc(t.mWhyP)    + '</p>'
        + '<h3>' + esc(t.mInstr)  + '</h3><p>' + esc(t.mInstrP)  + '</p>'
        + '<h3>' + esc(t.mSimult) + '</h3><p>' + esc(t.mSimultP) + '</p>'
        + '<h3>' + esc(t.mEvid)   + '</h3><p>' + esc(t.mEvidP)   + '</p>' },
      { key:"limits", title:t.accLimits, body:
          '<ul><li>' + esc(t.lGig) + '</li><li>' + esc(t.lTru) + '</li>'
        + '<li>' + esc(t.lRev) + '</li><li>' + esc(t.lTri) + '</li></ul>'
        + '<p>' + esc(t.lPend) + '</p>' },
      { key:"scope", title:t.accScope, body:
          '<h3>' + esc(t.sScope) + '</h3><p>' + esc(t.sScopeP) + '</p>'
        + '<h3>' + esc(t.sExcl)  + '</h3><p>' + esc(t.sExclP)  + '</p>'
        + '<dl class="kv">'
        +   '<dt>' + esc(t.kDate)     + '</dt><dd>' + esc(DATA.captureDate) + '</dd>'
        +   '<dt>' + esc(t.kAssessed) + '</dt><dd>' + DATA.totalAssessed + '</dd>'
        +   '<dt>' + esc(t.kOrigins)  + '</dt><dd>' + DATA.originsVerified + '</dd>'
        +   '<dt>' + esc(t.kDisc)     + '</dt><dd>' + DATA.originsDiscarded + '</dd>'
        +   '<dt>' + esc(t.kComp)     + '</dt><dd>~' + DATA.comparisons + '</dd>'
        +   '<dt>' + esc(t.kSignals)  + '</dt><dd>' + DATA.signalsFound + '</dd>'
        +   '<dt>' + esc(t.kSurv)     + '</dt><dd>' + DATA.signalsSurviving + '</dd>'
        + '</dl>' }
    ];
    var html = "";
    blocks.forEach(function(b){
      html += '<details class="acc" data-acc="' + b.key + '"' + (state.accOpen[b.key] ? " open" : "") + '>'
           +    '<summary>' + esc(b.title) + '</summary>'
           +    '<div class="accbody">' + b.body + '</div>'
           +  '</details>';
    });
    return html;
  },

  "v-footer": function(t){ return esc(t.footer); }
};

/* =========================================================================
   RENDER — single entry point. Walks the VIEWS map, no branching on language.
   ========================================================================= */
function render(){
  var t = I18N[state.lang];
  document.documentElement.lang = t.htmlLang;
  document.title = t.doctitle;
  document.getElementById("brandline").textContent = t.brandline;
  document.getElementById("doctitle").textContent  = t.doctitle;
  document.getElementById("docsub").textContent    = t.docsub;

  Object.keys(VIEWS).forEach(function(id){
    document.getElementById(id).innerHTML = VIEWS[id](t);
  });

  Array.prototype.forEach.call(document.querySelectorAll(".langtoggle button"), function(b){
    b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === state.lang));
  });
}

/* =========================================================================
   EVENTS — delegated, so they survive every re-render.
   ========================================================================= */
function toggleRow(row){
  var gid = row.getAttribute("data-gid");
  var pid = row.getAttribute("data-pid");
  var sel;
  if (gid){ state.groupOpen[gid] = !state.groupOpen[gid]; sel = 'tr.grouprow[data-gid="' + gid + '"]'; }
  else    { state.expanded[pid]  = !state.expanded[pid];  sel = 'tr.rowmain[data-pid="' + pid + '"]'; }
  render();
  var back = document.querySelector(sel);
  if (back) back.focus();
}

document.addEventListener("click", function(e){
  var langBtn = e.target.closest(".langtoggle button");
  if (langBtn){ state.lang = langBtn.getAttribute("data-lang"); render(); return; }

  var row = e.target.closest("tr.grouprow, tr.rowmain");
  if (row){ toggleRow(row); return; }
});

document.addEventListener("keydown", function(e){
  if (e.key !== "Enter" && e.key !== " ") return;
  var row = e.target.closest && e.target.closest("tr.grouprow, tr.rowmain");
  if (!row) return;
  e.preventDefault();
  toggleRow(row);
});

document.addEventListener("toggle", function(e){
  var d = e.target;
  if (d && d.tagName === "DETAILS" && d.hasAttribute("data-acc")){
    state.accOpen[d.getAttribute("data-acc")] = d.open;
  }
}, true);

render();
</script>
</body>
</html>
