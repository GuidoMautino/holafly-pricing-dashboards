 h+=`<div class="note">${E('Con el modelo actual pagamos por GB: si el cliente consume más, nuestro costo sube y el margen baja. Con revenue split pagamos un porcentaje del precio, así que el margen es el mismo consuma lo que consuma. <b>Promover hotspot es un argumento a favor del revenue split, no una alternativa.</b>','Under the current model we pay per GB: if the customer uses more, our cost rises and margin falls. Under revenue split we pay a share of the price, so margin is the same whatever they use. <b>Promoting hotspot is an argument for the revenue split, not an alternative to it.</b>')}</div>`;
 h+=`<div class="infh">${E('Margen por día de viaje según cuánto consume el cliente','Margin per travel day by customer data use')}</div>`;
 h+=`<table><thead><tr><th>${E('Consumo','Data use')}</th><th>${E('Modelo actual','Current model')}</th>`;
 D.esc.filter(e=>e.t).forEach(e=>h+=`<th>${e.n}</th>`);
 h+=`<th>${E('Qué nos conviene','What suits us')}</th></tr></thead><tbody>`;
 D.cons.niv.forEach(g=>{const a=marAct(g),hoy=Math.abs(g-D.cons.gd)<1e-9;
  const mej=D.esc.filter(e=>e.t&&(1-e.t)*D.cons.pl>a);
  const q=mej.length===0?E('el modelo actual','the current model'):(mej.length===4?E('cualquier split','any split'):E('split hasta ','split up to ')+mej[mej.length-1].n);
  h+=`<tr><td>${n2(g)} GB${hoy?` <span style="color:var(--muted);font-weight:400">${E('hoy','today')}</span>`:''}</td>`;
  h+=`<td class="${a<0?'g-r neg':''}">${eur2(a)}</td>`;
  D.esc.filter(e=>e.t).forEach(e=>{const m=(1-e.t)*D.cons.pl;h+=`<td class="${m>a?'g-ok pos':''}">${eur2(m)}</td>`});
  h+=`<td style="text-align:left;font-weight:${mej.length?800:400};color:${mej.length?'var(--green-d)':'var(--muted)'}">${q}</td></tr>`});
 h+='</tbody></table>';
 h+=`<div class="note">${E(`Banda de 4 a 7 días, que concentra el ${pc(D.bandas[2].share,0)} del revenue. En verde, cada split que deja más margen que el modelo actual. En rojo, donde el modelo actual pierde plata.`,`4-to-7-day band, which holds ${pc(D.bandas[2].share,0)} of revenue. In green, each split leaving more margin than the current model. In red, where the current model loses money.`)}</div>`;
 h+=`<div class="infh">${E('Cuánto tendría que subir el consumo para que cada escenario empate','How much data use would have to rise for each scenario to break even')}</div>`;
 h+=`<table><thead><tr><th>${E('Duración','Trip length')}</th><th>${E('% del revenue','% of revenue')}</th><th>${E('GB por día hoy','GB per day today')}</th><th>${E('70/30 desde','70/30 from')}</th><th>${E('Debe subir','Rise needed')}</th><th>${E('50/50 desde','50/50 from')}</th><th>${E('Debe subir','Rise needed')}</th></tr></thead><tbody>`;
 D.bandas.forEach(b=>{const f30=b.l30<=b.gd;
  h+=`<tr><td>${E(b.lab,BEN[b.lab])}</td><td>${pc(b.share,1)}</td><td>${n2(b.gd)}</td>
  <td class="g-w">${n2(b.l30)}</td><td class="g-w ${f30?'pos':''}">${f30?E('ya conviene','already wins'):pc0(b.l30/b.gd-1)}</td>
  <td class="g-r">${n2(b.l50)}</td><td class="g-r">${pc0(b.l50/b.gd-1)}</td></tr>`});
 h+='</tbody></table>';
 h+=`<div class="note">${ev('n')} ${E(`<b>Falta el volumen real de tethering.</b> El número que veníamos usando promediaba un ${pc(0.1514,2)} real con un cero que significaba "no reportado" de otro sistema. Es el único input pendiente de esta entrega.`,`<b>Real hotspot volume is missing.</b> The figure we were using averaged a real ${pc(0.1514,2)} with a zero that meant "not reported" from another system. It is the only pending input of this delivery.`)}</div>`;
 return h;
}

 ${num(n2(D.mkt.sup)+' USD',E('el supuesto de partida','the starting assumption'),'w')}
 ${num(n2(D.mkt.p90)+' USD',E('nuestro precio a 90 días','our price at 90 days'),'g')}
 ${num(D.fup.holafly+' GB',E('nuestro corte de velocidad','our throttling point'),'g')}</div>`;

 D.comp.forEach(c=>{h+=`<tr><td>${c.n}</td><td>${c.npts}</td><td>${pc(c.mn)}</td><td style="font-weight:800">${pc(c.md)}</td><td>${pc(c.mx)}</td>`;
  [c.t17,c.t815,c.t1630].forEach(v=>h+=`<td class="${v>0.25?'g-r neg':''}">${v==null?'·':pc(v)}</td>`);h+='</tr>'});
 h+='</tbody></table>';

 h+=`<div class="infh">${E('Precio por día de viaje, USD','Price per travel day, USD')}</div>`;
 h+=`<table><thead><tr><th>${E('Duración','Trip length')}</th><th>Holafly</th>`;
 ['Airalo','Saily','Nomad','Yesim'].forEach(k=>h+=`<th>${k}</th>`);h+='</tr></thead><tbody>';
 D.curva.forEach(c=>{h+=`<tr><td>${c.d} ${E('días','days')}</td><td class="g-n" style="font-weight:800">${n2(c.ud)}</td>`;
  ['Airalo','Saily','Nomad','Yesim'].forEach(k=>h+=`<td>${c.comp[k]==null?'·':n2(c.comp[k])}</td>`);h+='</tr>'});
 h+='</tbody></table>';
 h+=`<div class="note">${E(`Bajar el precio manteniendo el volumen destruye margen en euros: a ${n2(2)} USD por día habría que vender ${n2(1.93)} veces más sólo para no perder. Bajo revenue split duele menos, porque el costo baja junto con el precio.`,`Cutting price while holding volume destroys margin in euros: at ${n2(2)} USD per day we would need to sell ${n2(1.93)} times more just to stand still. Under revenue split it hurts less, because cost falls along with price.`)}</div>`;

 h+=`<div class="infh">${E('Si bajamos el precio, cuánto habría que vender para llegar al MISMO revenue de hoy','If we cut price, how much we would have to sell to reach today\u2019s revenue')}</div>`;
 h+=`<div class="note">${E('El ejercicio mantiene el revenue constante en los 20,81 millones de hoy: la columna de veces dice cuánto volumen adicional hace falta para llegar ahí. Y acá está lo que revela: <b>con el modelo actual, vender más unidades sube el costo de datos en la misma proporción</b>, porque hay más clientes consumiendo. Bajo revenue split el costo es siempre el mismo porcentaje del revenue, así que el margen no se mueve.','The exercise holds revenue constant at today\u2019s €20.81M: the multiple column says how much extra volume is needed to get there. And here is what it reveals: <b>under the current model, selling more units raises data cost in the same proportion</b>, because more customers are consuming. Under revenue split cost is always the same share of revenue, so margin does not move.')}</div>`;
 h+=`<table><thead><tr><th>${E('Precio por día','Price per day')}</th><th>${E('% del precio de hoy','% of today\u2019s price')}</th><th>${E('Cuánto habría que vender','How much we must sell')}</th><th>${E('Costo con modelo actual','Cost under current model')}</th><th>${E('Margen modelo actual','Current model margin')}</th><th>${E('Margen 80/20','80/20 margin')}</th><th>${E('Margen 70/30','70/30 margin')}</th></tr></thead><tbody>`;
 D.vol.forEach(v=>{const hoy=Math.abs(v.usd-D.pb)<1e-9;
  h+=`<tr><td>${n2(v.usd)} USD${hoy?` <span style="color:var(--muted);font-weight:400">${E('hoy','today')}</span>`:''}</td>
  <td>${pc(v.k,0)}</td><td class="${v.x>2.5?'g-r':'g-w'}" style="font-weight:800">${n2(v.x)}x</td>
  <td class="g-n">${eur(v.cost)}</td><td class="g-n ${!hoy?'neg':''}">${eur(v.mact)}</td>
  <td class="g-ok pos">${eur(v.m20)}</td><td class="g-w">${eur(v.m30)}</td></tr>`});
 h+='</tbody></table>';
 h+=`<div class="note">${E('<b>El revenue split es inmune a bajar precio y compensar con volumen</b>, porque su costo baja junto con el precio. El modelo actual la castiga. A 2 USD por día con volumen ×1,96 el modelo actual pierde 4,26 millones contra hoy, un 80/20 gana 278 mil, y un 70/30 pierde 1,80 millones: exactamente lo mismo que pierde sin tocar el precio, porque su costo es siempre el 30%.','<b>Revenue split is immune to cutting price and making it up on volume</b>, because its cost falls along with price. The current model punishes it. At 2 USD per day with 1.96x volume the current model loses €4.26M against today, an 80/20 gains €278K, and a 70/30 loses €1.80M: exactly what it loses without touching price at all, because its cost is always 30%.')}</div>`;
 return h;
}

function pager(){
 const T=TABS(),i=T.findIndex(t=>t[0]===V);
 const prev=i>0?T[i-1]:null,next=i<T.length-1?T[i+1]:null;

 h+=prev?`<button class="pgbtn" onclick="go('${prev[0]}')"><small>${E('anterior','previous')}</small>${prev[1]}</button>`:'<span></span>';
 h+=`<span class="sp"></span><span class="step">${i+1} / ${T.length}</span><span class="sp"></span>`;
 h+=next?`<button class="pgbtn next" onclick="go('${next[0]}')"><small>${E('siguiente','next')}</small>${next[1]} \u2192</button>`
       :`<a class="cta" href="${SHEET}" target="_blank">${E('Ver el detalle completo \u2192','See full detail \u2192')}</a>`;
 return h+'</div>';
}
