  `<b>Break-even in revenue</b> is how many more eSIMs we must sell to bill the same ${eur(D.rev)}. <b>Break-even in margin</b> is how many more to earn the same ${eur(D.mar)}. The second is always tougher, because cost per eSIM, ${eur2(D.u.cpo)}, does not fall when price falls.<br><br>

  `<b>Gross margin percentage does not depend on volume.</b> If we sell twice as much, revenue and cost rise in the same proportion and the percentage stays put. That is why there is no "how many more eSIMs" column here: selling more fixes margin in euros, not margin in percent.<br><br>

 }

 <p>Si bajamos el precio un 20%, el AOV baja a ${eur2(D.aov*0.8)}, pero el costo por orden sigue en ${eur2(D.u.cpo)} porque el cliente consume lo mismo. El margen por orden queda en ${eur2(D.aov*0.8-D.u.cpo)}: no bajó 20%, bajó ${pc(1-(D.aov*0.8-D.u.cpo)/D.mpo,0)}.</p>
 <p>Por eso las órdenes necesarias para mantener el margen crecen mucho más rápido que el recorte de precio. Es la razón de que a ${n2(D.u.px[5].usd)} USD por día haga falta ${pc0(D.u.px[5].dM)}: a ese precio el margen por orden es de ${eur2(D.u.px[5].mpo)}, contra ${eur2(D.mpo)} de hoy.</p>`,
 `<p>Today we sell ${nn(D.ord)} orders at ${eur2(D.aov)} Net AOV. Each order costs us <b>${eur2(D.u.cpo)}</b> in data and fixed charges, leaving ${eur2(D.mpo)} of margin.</p>
 <p>If we cut price 20%, AOV falls to ${eur2(D.aov*0.8)}, but cost per order stays at ${eur2(D.u.cpo)} because the customer uses the same. Margin per order lands at ${eur2(D.aov*0.8-D.u.cpo)}: it did not fall 20%, it fell ${pc(1-(D.aov*0.8-D.u.cpo)/D.mpo,0)}.</p>
 <p>That is why the orders needed to hold margin grow much faster than the price cut. It is why ${n2(D.u.px[5].usd)} USD per day needs ${pc0(D.u.px[5].dM)}: at that price margin per order is ${eur2(D.u.px[5].mpo)}, against ${eur2(D.mpo)} today.</p>`)}</div></details>`;
 return h;
}

function vNum(){
 const nn2=v=>Math.round(v).toLocaleString(_l());
 let h=`<div class="inftitular">${E('Cada número de este documento, en el orden del P&L, con la cuenta que lo produce y la fuente de la que sale.','Every figure in this document, in P&L order, with the arithmetic behind it and the source it comes from.')}</div>`;
 h+=`<div class="note">${E('Todo sale de la misma ventana: producto US stand alone, línea B2C de Trips, del 1-ene al 31-jul-2026. Los supuestos declarados son cinco y están al final de esta tab: que bajo revenue split el cargo fijo por eSIM deja de ser nuestro, sobre qué revenue se calcula el take, qué tráfico cubre el acuerdo, el punto de corte de velocidad y el tipo de cambio.','Everything comes from the same window: US stand-alone product, B2C Trips line, 1 Jan to 31 Jul 2026. There are five declared assumptions, listed at the end of this tab: that under revenue split the per-eSIM fixed charge stops being ours, which revenue the take is calculated on, which traffic the deal covers, the throttling point, and the exchange rate.')}</div>`;

 const row=(lab,val,calc,src,cls)=>`<tr><td style="font-weight:700">${lab}</td><td class="${cls||'g-n'}" style="font-weight:800;white-space:nowrap">${val}</td><td style="text-align:left;color:var(--muted);white-space:nowrap">${calc||'·'}</td><td style="text-align:left">${src}</td></tr>`;
 const sep=t=>`<tr class="sublbl"><td colspan="4" style="font-weight:700;color:var(--ink);padding-top:10px">${t}</td></tr>`;

 h+=`<div class="infh">${E('El P&L, línea por línea','The P&L, line by line')}</div>`;
 h+=`<table><thead><tr><th>${E('Dato','Figure')}</th><th>${E('Valor','Value')}</th><th>${E('Cómo se calcula','How it is calculated')}</th><th>${E('De dónde sale el dato','Where the data comes from')}</th></tr></thead><tbody>`;
 h+=sep(E('Lo que vendemos','What we sell'));
 h+=row(E('eSIMs vendidas','eSIMs sold'),nn2(D.ord),E('dato de origen · SSOT','source figure · SSOT'),E(`SSOT, no la vista del tablero. En la vista el proveedor es una dimensión y una eSIM que usó dos proveedores se cuenta dos veces: daba ${nn2(D.dup.esims_inf)} en vez de ${nn2(D.ord)}. El revenue, el costo y los GB sí se reparten entre esas filas y suman bien, así que esos tres se siguen tomando de la vista.`,`SSOT, not the dashboard view. In the view provider is a dimension and an eSIM that used two providers is counted twice: it gave ${nn2(D.dup.esims_inf)} instead of ${nn2(D.ord)}. Revenue, cost and GB are split across those rows and do add up, so those three still come from the view.`));
 h+=row(E('Net AOV','Net AOV'),eur2(D.aov),`${eur(D.rev)} ÷ ${nn2(D.ord)}`,E('Derivado. Es el ticket medio neto de descuentos e impuestos.','Derived. It is the average ticket net of discounts and taxes.'));
 h+=row(E('Revenue neto','Net revenue'),eur(D.rev),E('dato de origen','source figure'),E('<b>Tab de Gross Margin</b>, no la de Revenue. Las dos tabs del tablero miden universos distintos: Revenue da 22.290.085 € y Gross Margin 20.810.476 €, porque el GM toma sólo eSIMs con la orden terminada. Data confirmó el criterio y la composición de la brecha: eSIMs que nunca se activaron más órdenes no terminadas. <b>Tomamos el de GM porque el costo sale de la misma vista</b>: mezclarlos daría margen con revenue de una población y costo de otra, y el break-even pasaría de 21,35% a 19,93%, dando vuelta la recomendación. Cruzado contra BigQuery: 20.806.921 contra 20.810.084, 0,02% de diferencia.','<b>Gross Margin tab</b>, not the Revenue one. The two dashboard tabs measure different universes: Revenue gives €22,290,085 and Gross Margin €20,810,476, because GM takes only eSIMs with a completed order. Data confirmed the criterion and what the gap is made of: eSIMs never activated plus orders not completed. <b>We take the GM one because cost comes from that same view</b>: mixing them would give margin with revenue from one population and cost from another, and the break-even would move from 21.35% to 19.93%, flipping the recommendation. Cross-checked against BigQuery: 20,806,921 against 20,810,084, a 0.02% difference.'));
 h+=sep(E('Lo que el cliente usa','What the customer uses'));
 h+=row(E('Días vendidos','Days sold'),nn2(D.u.dias),E('suma de la duración de cada orden','sum of the duration of every order'),E(`SSOT. <b>En la vista los días no son una medición: son un cálculo</b>, el conteo de eSIMs multiplicado por la duración del plan, y esa duración sale de un regexp sobre el nombre de la variante. Por eso heredan la duplicación por proveedor y daban ${nn2(D.dup.dias_inf)} en vez de ${nn2(D.u.dias)}.`,`SSOT. <b>In the view days are not a measurement, they are a calculation</b>: the eSIM count times plan duration, with that duration extracted by regex from the variant name. That is why they inherit the provider duplication and gave ${nn2(D.dup.dias_inf)} instead of ${nn2(D.u.dias)}.`));
 h+=row(E('Días por eSIM','Days per eSIM'),n2(D.u.dias/D.ord),`${nn2(D.u.dias)} ÷ ${nn2(D.ord)}`,E('Derivado. La duración media de lo que vendemos.','Derived. The average duration of what we sell.'));
 h+=row(E('GB consumidos','GB used'),nn2(D.u.gb),E('dato de origen','source figure'),E('Vista de Gross Margin, la misma de la que sale el costo. Cruzada contra la tabla de consumo del MDM, que da 8.798.550 GB, un 10,79% más. La diferencia es de criterio de fecha: el MDM imputa por día de consumo y la vista por fin de producto. Se toma la de la vista para que GB, revenue y costo salgan del mismo lugar.','Gross Margin view, the same one the cost comes from. Cross-checked against the MDM consumption table, which gives 8,798,550 GB, 10.79% more. The difference is a date criterion: MDM books by day of use and the view by product end. We take the view so that GB, revenue and cost all come from the same place.'));
 h+=sep(E('Lo que nos cuesta','What it costs us'));
 h+=row(E('Costo de datos','Data cost'),eur(D.dc),E('dato de origen','source figure'),E(`Vista de Gross Margin. Es lo que le pagamos al proveedor por los GB que consume el cliente, y escala con el consumo. El costo por GB no es parejo entre duraciones: va de ${eur2(D.bandas[0].cgbb)} en los planes de 1 día a ${eur2(D.bandas[5].cgbb)} en los de 31 a 90, un ${pc(D.bandas[0].cgbb/D.bandas[5].cgbb-1,1)} más caro en las cortas.`,`Gross Margin view. It is what we pay the provider for the GB the customer uses, and it scales with usage. Cost per GB is not flat across durations: it runs from ${eur2(D.bandas[0].cgbb)} on 1-day plans to ${eur2(D.bandas[5].cgbb)} on 31-to-90-day ones, ${pc(D.bandas[0].cgbb/D.bandas[5].cgbb-1,1)} more expensive on the short ones.`));
 h+=row(E('Cargos fijos','Fixed cost'),eur(D.fc),E('dato de origen','source figure'),E('Export de COGS, columna separada del costo de datos. Es un cargo por eSIM activada. No depende de cuánto consuma el cliente ni de cuántos días dure el plan.','COGS export, a column separate from data cost. It is a charge per activated eSIM. It does not depend on how much the customer uses or how long the plan lasts.'));
 h+=row(E('Costo total','Total cost'),eur(D.cost),`${eur(D.dc)} + ${eur(D.fc)}`,E(`Datos más cargos fijos da ${eur(D.dc+D.fc)}, contra los ${eur(D.cost)} que reporta la vista. Sobran <b>${eur(D.disc.tot)}</b>, un ${pc(D.disc.pct,4)}. No es redondeo: la diferencia aparece en las seis bandas de duración con el mismo signo y equivale a <b>${n2(D.disc.por_esim*100)} céntimos por eSIM</b>. Es decir, hay un componente dentro de total_cost que no está ni en data_cost ni en cargos fijos. La tabla tiene una columna de costo de voz, pero está en cero en todas las filas, así que no es eso. Sigue abierto con Data. No mueve ninguna conclusión, pero conviene saber qué es antes de firmar un acuerdo que se calcula sobre el costo.`,
 `Data plus fixed charges gives ${eur(D.dc+D.fc)}, against the ${eur(D.cost)} the view reports. There is <b>${eur(D.disc.tot)}</b> extra, ${pc(D.disc.pct,4)}. It is not rounding: the difference shows up in all six duration bands with the same sign and works out to <b>${n2(D.disc.por_esim*100)} cents per eSIM</b>. That is, there is a component inside total_cost that is neither in data_cost nor in fixed charges. The table has a voice cost column, but it is zero in every row, so that is not it. Still open with Data. It moves no conclusion, but it is worth knowing what it is before signing a deal priced off cost.`));
 h+=row(E('Costo por eSIM','Cost per eSIM'),eur2(D.u.cpo),`${eur(D.cost)} ÷ ${nn2(D.ord)}`,E('Derivado. Es el número clave del ejercicio de bajar el precio: es lo que NO baja cuando baja el precio.','Derived. It is the key figure in the price-cut exercise: it is what does NOT fall when price falls.'));
 h+=sep(E('Lo que queda','What is left'));
 h+=row(E('Margen bruto','Gross margin'),eur(D.mar),`${eur(D.rev)} − ${eur(D.cost)}`,E('Derivado.','Derived.'),'g-ok');
 h+=row(E('Margen bruto %','Gross margin %'),pc(D.gm,2),`${eur(D.mar)} ÷ ${eur(D.rev)}`,E('Derivado.','Derived.'),'g-ok');
 h+=row(E('Margen por eSIM','Margin per eSIM'),eur2(D.mpo),`${eur(D.mar)} ÷ ${nn2(D.ord)}`,E('Derivado.','Derived.'),'g-ok');
 h+=row(E('Punto de equilibrio del take','Break-even take'),pc(D.be,2),`100% − ${pc(D.gm,2)}`,E(`Derivado, al precio y consumo de hoy. Por encima de ese take el revenue split cuesta más que el modelo actual. Y se mueve: si baja el precio, el revenue cae y el costo no, así que el techo sube, a 2,00 USD por día sería 28,38%. Si sube el consumo, el costo sube y el techo también, a +25% sería 25,92%. Por eso el techo se fija junto con el precio, no antes.`,`Derived, at today\u2019s price and usage. Above that take the revenue split costs more than the current model. And it moves: if price falls, revenue drops and cost does not, so the ceiling rises, at $2.00 a day it would be 28.38%. If usage rises, cost rises and so does the ceiling, at +25% it would be 25.92%. That is why the ceiling is set together with price, not before.`),'g-w');
 h+='</tbody></table>';

 h+=`<div class="infh">${E('Los unitarios por día de viaje, en el mismo orden','The per-travel-day unit figures, in the same order')}</div>`;
 h+=`<div class="note">${E(`Son las mismas líneas del P&L divididas por los <b>${nn2(D.u.dias)} días vendidos</b>. Se divide una sola vez sobre los totales del período: no es un promedio de promedios ni un promedio por banda de duración.`,`They are the same P&L lines divided by the <b>${nn2(D.u.dias)} days sold</b>. The division is done once over the period totals: it is not an average of averages nor an average by duration band.`)}</div>`;
 h+=`<table><thead><tr><th>${E('Dato','Figure')}</th><th>${E('Valor','Value')}</th><th>${E('Cómo se calcula','How it is calculated')}</th><th>${E('Qué significa','What it means')}</th></tr></thead><tbody>`;
 h+=row(E('Precio por día','Price per day'),eur2(D.u.pd),`${eur(D.rev)} ÷ ${nn2(D.u.dias)}`,E('Lo que efectivamente cobramos por cada día de viaje vendido. No es el precio de lista: es el realizado, después de descuentos y del mix de duraciones.','What we actually collect per travel day sold. Not the list price: it is the realised one, after discounts and the mix of durations.'));
 h+=row(E('GB por día','GB per day'),n2(D.u.gd),`${nn2(D.u.gb)} ÷ ${nn2(D.u.dias)}`,E('Consumo medio por día vendido. Una orden de 30 días pesa 30 veces más que una de 1 día, que es lo que corresponde: usa 30 veces más días de red.','Average usage per day sold. A 30-day order counts 30 times more than a 1-day one, which is right: it uses 30 times more network days.'));
 h+=row(E('Costo por GB','Cost per GB'),eur2(D.u.cgb),`${eur(D.dc)} ÷ ${nn2(D.u.gb)}`,E('Sólo costo de datos. No incluye los cargos fijos, porque esos no dependen de los GB.','Data cost only. It does not include fixed charges, because those do not depend on GB.'));
 h+=row(E('Costo de datos por día','Data cost per day'),eur2(D.u.dcd),`${n2(D.u.gd)} × ${eur2(D.u.cgb)}`,E('El consumo de un día por lo que cuesta cada GB. Sube si el cliente consume más.','A day of usage times the cost of each GB. It rises if the customer uses more.'));
 h+=row(E('Cargo fijo por día','Fixed cost per day'),eur2(D.u.fcd),`${eur(D.fc)} ÷ ${nn2(D.u.dias)}`,E(`Los cargos fijos del período repartidos entre los días vendidos. Da siete céntimos y medio: es el cargo por eSIM prorrateado sobre los ${n2(D.u.dias/D.ord)} días que dura la orden media. No es un precio de lista ni sube con el consumo.`,`The period fixed charges spread over days sold. It is seven and a half cents: the per-eSIM charge prorated over the ${n2(D.u.dias/D.ord)} days the average order lasts. It is not a list price and it does not rise with usage.`));
 h+=row(E('Costo por día','Cost per day'),eur2(D.u.cd),`${eur(D.cost)} ÷ ${nn2(D.u.dias)}`,E('Sale del costo total del tablero, no de sumar los dos de arriba. A dos decimales las dos vías dan lo mismo; con más decimales difieren un 0,03%, que es la discrepancia declarada entre el total reportado y sus partes. Se usa la del tablero para que el margen por día cierre exacto con el margen bruto del P&L.','It comes from the dashboard total cost, not from adding the two above. To two decimals both routes agree; with more decimals they differ by 0.03%, which is the declared discrepancy between the reported total and its parts. The dashboard route is used so that margin per day reconciles exactly with the P&L gross margin.'));

 h+=`<span class="sp"></span><span class="step">${i+1} / ${T.length}</span><span class="sp"></span>`;
